[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eclipse-viewshed"
version = "0.1.0"
description = "Skyline and eclipse-visibility analysis for five viewing sites in Antwerp."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "P. R. Truesdell"}]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
